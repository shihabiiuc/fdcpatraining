[build]
  command = "npm run build"
  publish = "dist"

# Content-hashed build assets never change under the same URL, so they can be
# cached by browsers indefinitely.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Static files in public/ aren't content-hashed, so allow revalidation while
# still avoiding a re-fetch on every repeat visit.
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"
